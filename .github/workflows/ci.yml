name: ci

# Minimal CI: lint + import smoke check.
# DOES NOT run training, eval, or anything that needs GPU / large data.
# Heavy jobs run on our 5090 box, not on GitHub-hosted runners.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9

      - name: ruff check
        run: ruff check . --output-format=github

  import-smoke:
    runs-on: ubuntu-22.04
    # Import-only check: we install upstream navsim from third_party/, no GPU,
    # no torch nightly (CI cannot pull cu128 wheels). This catches dumb syntax
    # / packaging errors before they hit the 5090 box.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: clone upstream navsim (shallow)
        run: |
          mkdir -p third_party
          if [ ! -d third_party/navsim ]; then
            git clone --depth 1 https://github.com/autonomousvision/navsim.git third_party/navsim
          fi

      - name: install minimal deps (cpu torch, no nightly)
        run: |
          python -m pip install --upgrade pip 'setuptools==65.5.1' wheel
          # CPU torch is fine for import-time checks. The real GPU stack is
          # installed locally on the 5090 box per env/setup_env.sh.
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision || true
          pip install -e third_party/navsim || echo "navsim install failed (expected on some deps); continuing import check"

      - name: import navsim
        run: |
          python - <<'PY'
          import importlib, sys
          try:
              importlib.import_module("navsim")
              print("navsim import OK")
          except Exception as e:
              print(f"navsim import failed: {e}", file=sys.stderr)
              # Non-fatal in CI — heavy deps (nuplan-devkit, etc.) may not install
              # cleanly on GitHub runners. The real check is on the 5090 box.
              sys.exit(0)
          PY
